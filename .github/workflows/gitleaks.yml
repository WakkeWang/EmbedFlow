name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly, off the hour marks

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: gitleaks scans commits, not just the tree
      # Default rules only (credentials). The internal-info extension
      # (.gitleaks.toml with product-line/path patterns) is deliberately NOT
      # committed: its rule literals are themselves internal names, so it
      # lives only in local clones (see .gitignore). CI therefore enforces
      # the credentials class; the internal-info class is enforced by the
      # local pre-push habit and the squash-before-public gate (issue #13).
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
