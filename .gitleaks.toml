# gitleaks extends the default rules (API keys, tokens, private keys). These
# custom rules catch the EmbedFlow-specific leak class: internal topology,
# real local paths, product-line identifiers that must not ship when the repo
# goes public (issue #13, decision 17A). Credentials alone were never the
# whole exposure.
#
# The pattern literals below necessarily contain the strings they match (a
# rule for "yy0133" must spell yy0133), so this file is allowlisted --
# gitleaks skips paths matched by the global allowlist.
title = "EmbedFlow internal-info rules"

[extend]
useDefault = true

[allowlist]
description = "Rule definitions must spell the patterns they match"
paths = ['''\.gitleaks\.toml$''']

[[rules]]
id = "embedflow-internal-ip"
description = "Internal LAN address in source or docs"
regex = '''\b192\.168\.\d{1,3}\.\d{1,3}\b|\b10\.\d{1,3}\.\d{1,3}\.\d{1,3}\b'''
keywords = ["192.168", "10."]

[[rules]]
id = "embedflow-product-line"
description = "Internal product-line identifier (pre-scrub naming)"
regex = '''(?i)\b0?yy[-_]?0?133\b|yy_d2000|0YY-449'''
keywords = ["yy0133", "0yy"]

[[rules]]
id = "embedflow-real-paths"
description = "Real local paths from the internal dev machine"
regex = '''[Dd]:\\+Hermes|[Ee]:\\+1_ZJ_Cloud|/root/git/yy0133'''
keywords = ["hermes", "1_zj_cloud"]
